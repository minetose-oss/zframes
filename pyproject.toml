[project]
name = "risk29-engine"
version = "0.1.0"
description = "Root shim so Vercel can install the Risk29 engine from the zframes monorepo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "services/risk29-engine"}

[tool.setuptools.packages.find]
where = ["services/risk29-engine"]
include = ["risk29_engine*"]

[tool.setuptools.package-data]
risk29_engine = ["signals.yaml"]
