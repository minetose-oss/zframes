registry_version: risk29-proposed-v1
target_signal_count: 29
threshold_version: risk29-p2-provisional-v1
model_version: risk29-p2-engine-0.2.0
minimum_signal_coverage: 0.70
minimum_weight_coverage: 0.75

categories:
  macro:
    label: Macro
    weight: 18
  credit:
    label: Credit
    weight: 14
  valuation:
    label: Valuation
    weight: 12
  sentiment:
    label: Sentiment
    weight: 16
  qualitative:
    label: Qualitative
    weight: 6
  liquidity:
    label: Liquidity
    weight: 14
  global:
    label: Global
    weight: 10
  technical:
    label: Technical
    weight: 10

signals:
  - id: vix
    label: VIX
    category: sentiment
    source: FRED
    source_series: VIXCLS
    unit: index
    fetch: fred
    transform: piecewise_latest
    points:
      - [10, 10]
      - [15, 25]
      - [20, 50]
      - [30, 80]
      - [45, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: sp500_trend
    label: S&P 500 Trend
    category: technical
    source: FRED
    source_series: SP500
    unit: index
    fetch: fred
    transform: equity_trend
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: nasdaq_trend
    label: Nasdaq Trend
    category: technical
    source: FRED
    source_series: NASDAQCOM
    unit: index
    fetch: fred
    transform: equity_trend
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: curve_2s10s
    label: 2Y-10Y Curve
    category: macro
    source: U.S. Treasury
    source_series: 2s10s
    unit: pct-points
    fetch: treasury_curve
    transform: piecewise_latest
    points:
      - [-1.0, 100]
      - [-0.5, 90]
      - [0.0, 60]
      - [0.5, 25]
      - [1.5, 10]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: hy_oas
    label: US HY OAS
    category: credit
    source: FRED
    source_series: BAMLH0A0HYM2
    unit: percent
    fetch: fred
    transform: piecewise_latest
    points:
      - [2.0, 10]
      - [3.0, 25]
      - [4.0, 50]
      - [6.0, 80]
      - [9.0, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: ig_oas
    label: US IG OAS
    category: credit
    source: FRED
    source_series: BAMLC0A0CM
    unit: percent
    fetch: fred
    transform: piecewise_latest
    points:
      - [0.4, 10]
      - [0.7, 25]
      - [1.0, 50]
      - [1.5, 80]
      - [2.5, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: real_yield_10y
    label: 10Y TIPS Real Yield
    category: macro
    source: FRED
    source_series: DFII10
    unit: percent
    fetch: fred
    transform: piecewise_latest
    points:
      - [-1.0, 10]
      - [0.0, 25]
      - [1.5, 50]
      - [2.5, 80]
      - [4.0, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: broad_dollar
    label: Broad Dollar Index
    category: global
    source: FRED
    source_series: DTWEXBGS
    unit: index
    fetch: fred
    transform: momentum_20d
    points:
      - [-5.0, 15]
      - [0.0, 35]
      - [3.0, 60]
      - [6.0, 80]
      - [10.0, 100]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: ofr_fsi
    label: OFR Financial Stress
    category: liquidity
    source: OFR
    source_series: OFR FSI
    unit: index
    fetch: ofr
    transform: piecewise_latest
    points:
      - [-2.0, 5]
      - [-1.0, 15]
      - [0.0, 40]
      - [1.0, 75]
      - [3.0, 100]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: gold_trend
    label: Gold Trend
    category: global
    source: LBMA
    source_series: XAU PM Fix
    unit: usd/oz
    fetch: lbma_gold
    transform: momentum_20d
    points:
      - [-10.0, 15]
      - [-3.0, 25]
      - [0.0, 35]
      - [8.0, 65]
      - [15.0, 85]
      - [25.0, 100]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: core_inflation_momentum
    label: Core Inflation Momentum
    category: macro
    source: BLS/FRED
    source_series: CPILFESL
    unit: percent
    fetch: fred
    transform: core_inflation_3m_annualized_vs_12m
    level_weight: 0.70
    acceleration_weight: 0.30
    points:
      - [1.0, 10]
      - [2.0, 25]
      - [3.0, 50]
      - [4.0, 70]
      - [6.0, 95]
    acceleration_points:
      - [-2.0, 10]
      - [-1.0, 20]
      - [0.0, 35]
      - [1.0, 65]
      - [2.0, 90]
      - [3.0, 100]
    freshness:
      fresh_hours: 1488
      delayed_hours: 2208

planned_signals:
  - id: sahm_labor_deterioration
    label: Sahm / Labor Deterioration
    category: macro
    source: FRED
    source_series: SAHMREALTIME
    unit: pct-points
    transform: sahm_level_and_change

  - id: ccc_bb_stress_spread
    label: CCC-BB Stress Spread
    category: credit
    source: ICE BofA/FRED
    unit: percent
    transform: ccc_minus_bb_spread

  - id: baa_treasury_spread
    label: Baa-Treasury Spread
    category: credit
    source: Moody's/FRED
    source_series: BAA10Y
    unit: percent
    transform: piecewise_and_change

  - id: sp500_forward_pe_percentile
    label: S&P 500 Forward P/E Percentile
    category: valuation
    source: FactSet/Bigdata
    unit: percentile
    transform: rolling_10y_percentile

  - id: equity_risk_premium
    label: Equity Risk Premium
    category: valuation
    source: Earnings + FRED
    unit: percent
    transform: forward_earnings_yield_minus_real_yield

  - id: cape_long_term_valuation
    label: CAPE / Long-Term Valuation
    category: valuation
    source: Shiller
    unit: percentile
    transform: historical_percentile

  - id: put_call_ratio
    label: Put/Call Ratio
    category: sentiment
    source: CBOE
    unit: ratio
    transform: rolling_percentile

  - id: aaii_bull_bear_spread
    label: AAII Bull-Bear Spread
    category: sentiment
    source: AAII
    unit: pct-points
    transform: contrarian_percentile

  - id: cftc_equity_positioning
    label: CFTC Equity Positioning
    category: sentiment
    source: CFTC COT
    unit: z-score
    transform: net_positioning_zscore

  - id: geopolitical_event_shock
    label: Geopolitical / Event Shock
    category: qualitative
    source: GDELT + trusted news
    unit: score
    transform: event_severity_rubric

  - id: policy_regime_shock
    label: Policy / Regime Shock
    category: qualitative
    source: Fed/ECB/BoJ + official releases
    unit: score
    transform: policy_event_classifier

  - id: chicago_fed_nfci
    label: Chicago Fed NFCI
    category: liquidity
    source: Chicago Fed/FRED
    source_series: NFCI
    unit: index
    transform: level_and_change

  - id: us_net_liquidity
    label: US Net Liquidity
    category: liquidity
    source: Fed/FRED
    source_series: WALCL - WTREGEN - RRPONTSYD
    unit: usd
    transform: level_momentum_and_zscore

  - id: sofr_iorb_funding_spread
    label: SOFR-IORB Funding Spread
    category: liquidity
    source: NY Fed/FRED
    source_series: SOFR - IORB
    unit: pct-points
    transform: spread_and_zscore

  - id: oil_shock
    label: Oil Shock
    category: global
    source: EIA/FRED
    source_series: DCOILWTICO
    unit: percent
    transform: momentum_20d_plus_realized_vol

  - id: cross_asset_correlation_spike
    label: Cross-Asset Correlation Spike
    category: global
    source: Market prices
    unit: z-score
    transform: average_20d_correlation_zscore

  - id: market_breadth
    label: Market Breadth
    category: technical
    source: Constituent market data
    unit: percent
    transform: pct_above_200dma_plus_advance_decline

  - id: realized_volatility_regime
    label: Realized Volatility Regime
    category: technical
    source: S&P 500 prices
    source_series: SP500
    unit: percent
    transform: rv20_vs_rv60_plus_percentile
