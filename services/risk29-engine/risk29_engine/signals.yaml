registry_version: risk29-proposed-v1
target_signal_count: 29
threshold_version: risk29-p2-provisional-v2
model_version: risk29-p2-engine-0.3.0
minimum_signal_coverage: 0.70
minimum_weight_coverage: 0.75

categories:
  macro:
    label: Macro
    weight: 18
  credit:
    label: Credit
    weight: 14
  valuation:
    label: Valuation
    weight: 12
  sentiment:
    label: Sentiment
    weight: 16
  qualitative:
    label: Qualitative
    weight: 6
  liquidity:
    label: Liquidity
    weight: 14
  global:
    label: Global
    weight: 10
  technical:
    label: Technical
    weight: 10

signals:
  - id: vix
    label: VIX
    category: sentiment
    source: FRED
    source_series: VIXCLS
    unit: index
    fetch: fred
    transform: piecewise_latest
    points:
      - [10, 10]
      - [15, 25]
      - [20, 50]
      - [30, 80]
      - [45, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: sp500_trend
    label: S&P 500 Trend
    category: technical
    source: FRED
    source_series: SP500
    unit: index
    fetch: fred
    transform: equity_trend
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: nasdaq_trend
    label: Nasdaq Trend
    category: technical
    source: FRED
    source_series: NASDAQCOM
    unit: index
    fetch: fred
    transform: equity_trend
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: curve_2s10s
    label: 2Y-10Y Curve
    category: macro
    source: U.S. Treasury
    source_series: 2s10s
    unit: pct-points
    fetch: treasury_curve
    transform: piecewise_latest
    points:
      - [-1.0, 100]
      - [-0.5, 90]
      - [0.0, 60]
      - [0.5, 25]
      - [1.5, 10]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: hy_oas
    label: US HY OAS
    category: credit
    source: FRED
    source_series: BAMLH0A0HYM2
    unit: percent
    fetch: fred
    transform: piecewise_latest
    points:
      - [2.0, 10]
      - [3.0, 25]
      - [4.0, 50]
      - [6.0, 80]
      - [9.0, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: ig_oas
    label: US IG OAS
    category: credit
    source: FRED
    source_series: BAMLC0A0CM
    unit: percent
    fetch: fred
    transform: piecewise_latest
    points:
      - [0.4, 10]
      - [0.7, 25]
      - [1.0, 50]
      - [1.5, 80]
      - [2.5, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: real_yield_10y
    label: 10Y TIPS Real Yield
    category: macro
    source: FRED
    source_series: DFII10
    unit: percent
    fetch: fred
    transform: piecewise_latest
    points:
      - [-1.0, 10]
      - [0.0, 25]
      - [1.5, 50]
      - [2.5, 80]
      - [4.0, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: broad_dollar
    label: Broad Dollar Index
    category: global
    source: FRED
    source_series: DTWEXBGS
    unit: index
    fetch: fred
    transform: momentum_20d
    points:
      - [-5.0, 15]
      - [0.0, 35]
      - [3.0, 60]
      - [6.0, 80]
      - [10.0, 100]
    freshness:
      # H.10 can publish daily observations with a multi-day reporting lag.
      # Keep source-lag awareness separate from missing/error handling.
      fresh_hours: 240
      delayed_hours: 336

  - id: ofr_fsi
    label: OFR Financial Stress
    category: liquidity
    source: OFR
    source_series: OFR FSI
    unit: index
    fetch: ofr
    transform: piecewise_latest
    points:
      - [-2.0, 5]
      - [-1.0, 15]
      - [0.0, 40]
      - [1.0, 75]
      - [3.0, 100]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: gold_trend
    label: Gold Trend
    category: global
    source: Nasdaq/FRED
    source_series: NASDAQQGLDI
    unit: index
    fetch: fred
    transform: momentum_20d
    points:
      - [-10.0, 15]
      - [-3.0, 25]
      - [0.0, 35]
      - [8.0, 65]
      - [15.0, 85]
      - [25.0, 100]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: core_inflation_momentum
    label: Core Inflation Momentum
    category: macro
    source: BLS/FRED
    source_series: CPILFESL
    unit: percent
    fetch: fred
    transform: core_inflation_3m_annualized_vs_12m
    level_weight: 0.70
    acceleration_weight: 0.30
    points:
      - [1.0, 10]
      - [2.0, 25]
      - [3.0, 50]
      - [4.0, 70]
      - [6.0, 95]
    acceleration_points:
      - [-2.0, 10]
      - [-1.0, 20]
      - [0.0, 35]
      - [1.0, 65]
      - [2.0, 90]
      - [3.0, 100]
    freshness:
      fresh_hours: 1488
      delayed_hours: 2208

  - id: sahm_labor_deterioration
    label: Sahm / Labor Deterioration
    category: macro
    source: FRED
    source_series: SAHMREALTIME
    unit: pct-points
    fetch: fred
    transform: sahm_level_and_change
    level_weight: 0.80
    change_weight: 0.20
    points:
      - [0.0, 10]
      - [0.2, 25]
      - [0.35, 50]
      - [0.5, 80]
      - [0.75, 100]
    change_points:
      - [-0.2, 10]
      - [0.0, 30]
      - [0.1, 50]
      - [0.2, 75]
      - [0.4, 100]
    freshness:
      fresh_hours: 1488
      delayed_hours: 2208

  - id: baa_treasury_spread
    label: Baa-Treasury Spread
    category: credit
    source: Moody's/FRED
    source_series: BAA10Y
    unit: percent
    fetch: fred
    transform: piecewise_and_change
    level_weight: 0.80
    change_weight: 0.20
    change_periods: 63
    change_window: 3m
    points:
      - [1.0, 10]
      - [1.5, 25]
      - [2.0, 45]
      - [3.0, 70]
      - [5.0, 100]
    change_points:
      - [-0.5, 10]
      - [0.0, 30]
      - [0.5, 60]
      - [1.0, 85]
      - [2.0, 100]
    freshness:
      fresh_hours: 96
      delayed_hours: 144

  - id: ccc_bb_stress_spread
    label: CCC-BB Stress Spread
    category: credit
    source: ICE BofA/FRED
    source_series: BAMLH0A3HYC - BAMLH0A1HYBB
    source_series_left: BAMLH0A3HYC
    source_series_right: BAMLH0A1HYBB
    unit: percent
    fetch: fred_spread
    transform: piecewise_and_change
    level_weight: 0.80
    change_weight: 0.20
    change_periods: 63
    change_window: 3m
    points:
      - [3.0, 10]
      - [5.0, 25]
      - [7.0, 45]
      - [9.0, 65]
      - [12.0, 85]
      - [16.0, 100]
    change_points:
      - [-1.0, 10]
      - [0.0, 30]
      - [1.0, 55]
      - [2.0, 75]
      - [4.0, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: chicago_fed_nfci
    label: Chicago Fed NFCI
    category: liquidity
    source: Chicago Fed/FRED
    source_series: NFCI
    unit: index
    fetch: fred
    transform: piecewise_and_change
    level_weight: 0.80
    change_weight: 0.20
    change_periods: 13
    change_window: 3m
    points:
      - [-1.0, 10]
      - [-0.5, 20]
      - [0.0, 40]
      - [0.5, 65]
      - [1.0, 85]
      - [2.0, 100]
    change_points:
      - [-0.5, 10]
      - [-0.25, 20]
      - [0.0, 30]
      - [0.25, 55]
      - [0.5, 75]
      - [1.0, 100]
    freshness:
      fresh_hours: 240
      delayed_hours: 336

  - id: sofr_iorb_funding_spread
    label: SOFR-IORB Funding Spread
    category: liquidity
    source: NY Fed/FRED
    source_series: SOFR - IORB
    source_series_left: SOFR
    source_series_right: IORB
    unit: pct-points
    fetch: fred_spread
    transform: spread_and_zscore
    level_weight: 0.60
    zscore_weight: 0.40
    zscore_lookback: 252
    zscore_min_observations: 60
    points:
      - [-0.10, 5]
      - [-0.05, 10]
      - [0.0, 25]
      - [0.02, 40]
      - [0.05, 60]
      - [0.10, 80]
      - [0.20, 100]
    zscore_points:
      - [-1.0, 10]
      - [0.0, 25]
      - [1.0, 50]
      - [2.0, 75]
      - [3.0, 100]
    freshness:
      fresh_hours: 72
      delayed_hours: 120

  - id: us_net_liquidity
    label: US Net Liquidity
    category: liquidity
    source: Fed/NY Fed/FRED
    source_series: WALCL - WTREGEN - RRPONTSYD
    source_series_assets: WALCL
    source_series_tga: WTREGEN
    source_series_rrp: RRPONTSYD
    unit: usd-billions
    fetch: fred_net_liquidity
    transform: level_momentum_and_zscore
    momentum_periods: 4
    change_window: 4w
    momentum_weight: 0.60
    zscore_weight: 0.40
    zscore_lookback: 52
    zscore_min_observations: 26
    momentum_points:
      - [-10.0, 100]
      - [-5.0, 85]
      - [-2.0, 65]
      - [0.0, 40]
      - [2.0, 25]
      - [5.0, 10]
    zscore_points:
      - [-2.0, 100]
      - [-1.0, 75]
      - [0.0, 40]
      - [1.0, 20]
      - [2.0, 10]
    freshness:
      fresh_hours: 240
      delayed_hours: 336

  - id: cape_long_term_valuation
    label: CAPE / Long-Term Valuation
    category: valuation
    source: Robert Shiller
    source_series: CAPE
    source_metric: cape
    unit: x
    fetch: shiller
    transform: piecewise_latest
    change_window: 1m
    points:
      - [10.0, 10]
      - [15.0, 20]
      - [20.0, 30]
      - [25.0, 45]
      - [30.0, 60]
      - [35.0, 75]
      - [40.0, 90]
      - [45.0, 100]
    freshness:
      fresh_hours: 1488
      delayed_hours: 2208

  - id: equity_risk_premium
    label: Excess CAPE Yield (ERP Proxy)
    category: valuation
    source: Robert Shiller
    source_series: Excess CAPE Yield
    source_metric: excess_cape_yield
    unit: percent
    fetch: shiller
    transform: piecewise_latest
    change_window: 1m
    points:
      - [-2.0, 100]
      - [0.0, 90]
      - [1.0, 75]
      - [2.0, 55]
      - [3.0, 35]
      - [4.0, 20]
      - [6.0, 10]
    freshness:
      fresh_hours: 1488
      delayed_hours: 2208

planned_signals:
  - id: sp500_forward_pe_percentile
    label: S&P 500 Forward P/E Percentile
    category: valuation
    source: FactSet/Bigdata
    unit: percentile
    transform: rolling_10y_percentile

  - id: put_call_ratio
    label: Put/Call Ratio
    category: sentiment
    source: CBOE
    unit: ratio
    transform: rolling_percentile

  - id: aaii_bull_bear_spread
    label: AAII Bull-Bear Spread
    category: sentiment
    source: AAII
    unit: pct-points
    transform: contrarian_percentile

  - id: cftc_equity_positioning
    label: CFTC Equity Positioning
    category: sentiment
    source: CFTC COT
    unit: z-score
    transform: net_positioning_zscore

  - id: geopolitical_event_shock
    label: Geopolitical / Event Shock
    category: qualitative
    source: GDELT + trusted news
    unit: score
    transform: event_severity_rubric

  - id: policy_regime_shock
    label: Policy / Regime Shock
    category: qualitative
    source: Fed/ECB/BoJ + official releases
    unit: score
    transform: policy_event_classifier

  - id: oil_shock
    label: Oil Shock
    category: global
    source: EIA/FRED
    source_series: DCOILWTICO
    unit: percent
    transform: momentum_20d_plus_realized_vol

  - id: cross_asset_correlation_spike
    label: Cross-Asset Correlation Spike
    category: global
    source: Market prices
    unit: z-score
    transform: average_20d_correlation_zscore

  - id: market_breadth
    label: Market Breadth
    category: technical
    source: Constituent market data
    unit: percent
    transform: pct_above_200dma_plus_advance_decline

  - id: realized_volatility_regime
    label: Realized Volatility Regime
    category: technical
    source: S&P 500 prices
    source_series: SP500
    unit: percent
    transform: rv20_vs_rv60_plus_percentile
