name: Risk29 test diagnose

on:
  push:
    branches: [risk29-poc]
    paths:
      - .github/workflows/risk29-test-diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: risk29-poc
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests and print concise failure tail
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/risk29-test.log 2>&1
          rc=$?
          echo "=== TEST EXIT CODE: $rc ==="
          echo "=== FAILURE SUMMARY ==="
          grep -nE "FAIL|Failed|failed|AssertionError|Error:|Test Files|Tests " /tmp/risk29-test.log | tail -n 120 || true
          echo "=== LOG TAIL ==="
          tail -n 180 /tmp/risk29-test.log
          exit $rc
