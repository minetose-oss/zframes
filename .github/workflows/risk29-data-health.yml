name: Risk29 Data Health CI
# Probes https://risk29-engine-phase1b-live.vercel.app and fails closed when that payload is unhealthy.

on:
  push:
    branches: [main, risk29-live-data, investment-data-engine-phase1]
    paths:
      - "scripts/risk29_health_validator.py"
      - "scripts/risk29_health_probe.py"
      - "tests/test_risk29_health_validator.py"
      - ".github/workflows/risk29-data-health.yml"
  pull_request:
    paths:
      - "scripts/risk29_health_validator.py"
      - "scripts/risk29_health_probe.py"
      - "tests/test_risk29_health_validator.py"
      - ".github/workflows/risk29-data-health.yml"
  schedule:
    - cron: "30 0 * * *" # 07:30 Asia/Bangkok (UTC+7), after morning publish
    - cron: "15 6 * * *" # 13:15 Asia/Bangkok, after afternoon publish
    - cron: "15 9 * * *" # 16:15 Asia/Bangkok
  workflow_dispatch:
    inputs:
      mode:
        description: "Run health checks or send a safe LINE test notification"
        required: true
        type: choice
        default: health-check
        options:
          - health-check
          - test-alert

permissions:
  contents: read

jobs:
  unit-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'test-alert' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validator tests
        run: python -m unittest discover -s tests -p 'test_risk29_health_validator.py' -v

  live-health:
    # Production endpoint is deployed after merge; PRs exercise mocked contracts.
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'test-alert') }}
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe production and fallback
        run: python scripts/risk29_health_probe.py --output risk29-data-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk29-data-health
          path: risk29-data-health.json
          if-no-files-found: warn

  health-failure-alert:
    name: Notify Risk29 health failure
    needs: [unit-tests, live-health]
    if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'test-alert') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify LINE of health failure
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          LIVE_RESULT: ${{ needs.live-health.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN", "").strip()
          recipient = os.environ.get("LINE_TO_USER_ID", "").strip()
          if not token or not recipient:
              print(
                  "::warning::Risk29 health failed and the LINE notification was not sent. "
                  "Add repository Actions secrets LINE_CHANNEL_ACCESS_TOKEN "
                  "(LINE Messaging API channel access token) and LINE_TO_USER_ID "
                  "(the recipient user ID). This does not change the health result."
              )
              sys.exit(0)
          run_url = f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          message = (
              "🚨 Risk29 DATA HEALTH FAIL\\n"
              f"Unit tests: {os.environ['UNIT_RESULT']} | Live health: {os.environ['LIVE_RESULT']}\\n"
              "Do not treat stale/missing signals as zero risk. Review production and fallback.\\n"
              f"Run: {run_url}"
          )
          data = json.dumps({"to": recipient, "messages": [{"type": "text", "text": message}]}).encode()
          req = urllib.request.Request(
              "https://api.line.me/v2/bot/message/push", data=data, method="POST",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              if response.status != 200:
                  raise RuntimeError(f"LINE push returned HTTP {response.status}")
              print(f"Risk29 health failure alert delivered: HTTP {response.status}")
          PY

  test-line-alert:
    name: Test LINE alert (no production changes)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test-alert' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send labeled LINE test message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN", "").strip()
          recipient = os.environ.get("LINE_TO_USER_ID", "").strip()
          if not token or not recipient:
              print(
                  "::warning::LINE test skipped: repository Actions secrets "
                  "LINE_CHANNEL_ACCESS_TOKEN and LINE_TO_USER_ID are not set. "
                  "Use a LINE Messaging API channel access token and the recipient "
                  "user ID. No test message was sent."
              )
              sys.exit(0)
          url = f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          message = "[TEST ONLY] Risk29 LINE Health Alert\\nThis is a delivery test, NOT a real Risk29 failure.\\n" + url
          data = json.dumps({"to": recipient, "messages": [{"type": "text", "text": message}]}).encode("utf-8")
          request = urllib.request.Request(
              "https://api.line.me/v2/bot/message/push", data=data, method="POST",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Unexpected LINE HTTP {response.status}")
                  print("LINE test push accepted (HTTP 200). Confirm recipient delivery separately.")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[:300]
              print(f"::error::LINE test push rejected: HTTP {exc.code} {detail}")
              sys.exit(1)
          PY
