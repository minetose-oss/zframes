name: Semiconductor Technical Data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "risk29/**"
      - ".github/workflows/semiconductor-technical.yml"
  schedule:
    - cron: "30 1 * * 1-5"
permissions:
  contents: write
concurrency:
  group: semiconductor-technical-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh historical series and technical checks
        run: python risk29/live_semiconductor.py
      - name: Validate data coverage and freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('risk29/semiconductor-latest.json').read_text())
          assert data['overall'].startswith('CALCULATED'), data
          assert all(v.get('sessions', 0) >= 220 for v in data['symbols'].values()), data
          print('SMH and SOXX history and freshness verified')
          PY
      - name: Commit validated result
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risk29/semiconductor-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh semiconductor technical status"
            git push origin HEAD:main
          fi
