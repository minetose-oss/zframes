name: Risk29 Credit Shadow Pilot

on:
  pull_request:
    paths:
      - "risk29/credit_shadow.py"
      - "risk29/test_credit_shadow.py"
      - ".github/workflows/risk29-credit-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test fail-closed behavior
        run: python -m unittest discover -s risk29 -p test_credit_shadow.py -v
      - name: Collect SEC pilot evidence
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: python risk29/credit_shadow.py --output credit-shadow.json
      - name: Upload shadow evidence
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: risk29-credit-shadow
          path: credit-shadow.json
          if-no-files-found: error
