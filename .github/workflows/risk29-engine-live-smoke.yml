name: Risk29 engine live smoke

on:
  push:
    branches: [risk29-phase1]
    paths:
      - services/risk29-engine/**
      - .github/workflows/risk29-engine-live-smoke.yml
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/risk29-engine/pyproject.toml
      - name: Install engine
        run: python -m pip install -e services/risk29-engine
      - name: Fetch and calculate current Risk29 snapshot
        run: |
          python <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from risk29_engine.engine import Risk29Engine
          from risk29_engine.sources import PublicSourceClient

          async def main():
              engine = Risk29Engine(
                  PublicSourceClient(timeout_seconds=30),
                  data_dir=Path('/tmp/risk29-live-smoke'),
                  refresh_seconds=1,
              )
              snapshot = await engine.latest(force=True)
              print(json.dumps({
                  'generatedAt': snapshot.generatedAt,
                  'score': snapshot.score,
                  'state': snapshot.state,
                  'regime': snapshot.regime,
                  'health': snapshot.health.model_dump(),
                  'signals': [
                      {
                          'id': signal.id,
                          'value': signal.value,
                          'riskScore': signal.riskScore,
                          'freshness': signal.freshness,
                          'reason': signal.reason,
                      }
                      for signal in snapshot.signals
                  ],
              }, indent=2))
              assert snapshot.health.available >= 8, 'fewer than 8/10 live signals available'
              assert snapshot.score is not None, 'overall score unavailable'

          asyncio.run(main())
          PY
