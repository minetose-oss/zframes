name: Risk29 engine

on:
  push:
    branches: [risk29-phase1, risk29-phase2]
    paths:
      - services/risk29-engine/**
      - .github/workflows/risk29-engine.yml
  pull_request:
    paths:
      - services/risk29-engine/**
      - .github/workflows/risk29-engine.yml
  schedule:
    - cron: "30 1 * * 1-5"
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/risk29-engine/pyproject.toml
      - name: Install engine
        run: python -m pip install -e 'services/risk29-engine[test]'
      - name: Compile
        run: python -m compileall -q services/risk29-engine/risk29_engine
      - name: Test
        run: python -m pytest -q services/risk29-engine/tests

  publish-live:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: risk29-live-publisher
      cancel-in-progress: false
    steps:
      - name: Check out engine source
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/risk29-engine/pyproject.toml

      - name: Install engine
        run: python -m pip install -e 'services/risk29-engine[test]'

      - name: Calculate validated live snapshot
        env:
          RISK29_EXISTING_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/risk29-live-data/risk29
          RISK29_PUBLISH_HTTP_TIMEOUT_SECONDS: "20"
          RISK29_PUBLISH_RETRY_ATTEMPTS: "2"
          RISK29_PUBLISH_MINIMUM_AVAILABLE: "7"
        run: >-
          python -m risk29_engine.publish
          --output-dir /tmp/risk29-published
          --existing-base-url "$RISK29_EXISTING_BASE_URL"
          --minimum-available "$RISK29_PUBLISH_MINIMUM_AVAILABLE"

      - name: Check out durable data branch
        uses: actions/checkout@v7
        with:
          ref: risk29-live-data
          path: risk29-live-data
          fetch-depth: 1

      - name: Publish latest and history JSON
        run: |
          mkdir -p risk29-live-data/risk29
          cp /tmp/risk29-published/latest.json risk29-live-data/risk29/latest.json
          cp /tmp/risk29-published/history.json risk29-live-data/risk29/history.json
          cp /tmp/risk29-published/brief-th.json risk29-live-data/risk29/brief-th.json
          cp /tmp/risk29-published/alert.json risk29-live-data/risk29/alert.json
          cd risk29-live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risk29/latest.json risk29/history.json risk29/brief-th.json risk29/alert.json
          if git diff --cached --quiet; then
            echo "Risk29 publication unchanged"
            exit 0
          fi
          git commit -m "data: refresh Risk29 live snapshot"
          git push origin HEAD:risk29-live-data

      - name: Check material alert
        id: material
        shell: bash
        run: |
          SHOULD_NOTIFY="$(python -c 'import json; print(str(json.load(open("/tmp/risk29-published/alert.json"))["shouldNotify"]).lower())')"
          echo "should_notify=$SHOULD_NOTIFY" >> "$GITHUB_OUTPUT"

      - name: Push material alert to LINE
        if: steps.material.outputs.should_notify == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.getenv("LINE_CHANNEL_ACCESS_TOKEN", "").strip()
          to = os.getenv("LINE_TO_USER_ID", "").strip()
          if not token or not to:
              print("Material alert detected; LINE credentials are not configured, so push is skipped.")
              raise SystemExit(0)

          alert = json.load(open("/tmp/risk29-published/alert.json", encoding="utf-8"))
          payload = json.dumps(
              {"to": to, "messages": [{"type": "text", "text": alert["messageThai"]}]},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://api.line.me/v2/bot/message/push",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              print(f"LINE material alert pushed: HTTP {response.status}")
          PY
