name: Risk29 Phase32 formatter

on:
  push:
    branches: [risk29-phase2]
    paths:
      - ".github/workflows/risk29-phase32-format-temp.yml"
      - "packages/frames/src/risk29-action-map.tsx"
      - "packages/frames/src/risk29-decision.tsx"
      - "packages/frames/src/risk29-shared.test.ts"
      - "packages/frames/src/risk29-shared.ts"

permissions:
  contents: write

jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'style(risk29): prettier Phase 3.2') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: risk29-phase2
      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/frames/src/risk29-action-map.tsx packages/frames/src/risk29-decision.tsx packages/frames/src/risk29-shared.test.ts packages/frames/src/risk29-shared.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/frames/src/risk29-action-map.tsx packages/frames/src/risk29-decision.tsx packages/frames/src/risk29-shared.test.ts packages/frames/src/risk29-shared.ts
          git commit -m "style(risk29): prettier Phase 3.2"
          git push origin HEAD:risk29-phase2
