name: Risk29 targeted type fix

on:
  push:
    branches: [risk29-poc]
    paths:
      - .github/workflows/risk29-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: risk29-poc

      - name: Apply typed Risk29 category tuple fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/provider-demo/src/mock-provider.ts")
          text = path.read_text()
          old = '''      categories: [
        "macro",
        "credit",
        "valuation",
        "sentiment",
        "qualitative",
        "liquidity",
        "global",
        "technical",
      ].map(unavailableCategory),'''
          new = '''      categories: (
        [
          "macro",
          "credit",
          "valuation",
          "sentiment",
          "qualitative",
          "liquidity",
          "global",
          "technical",
        ] as const
      ).map(unavailableCategory),'''
          if old not in text:
              raise SystemExit("Risk29 category map anchor not found")
          path.write_text(text.replace(old, new, 1))

          # Keep this branch clean: the helper workflow removes itself in the same fix commit.
          Path(".github/workflows/risk29-typefix.yml").unlink()

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/provider-demo/src/mock-provider.ts .github/workflows/risk29-typefix.yml
          git commit -m "fix(risk29): type demo category ids as literals"
          git push origin HEAD:risk29-poc
