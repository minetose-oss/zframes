name: Risk29 targeted type fix

on:
  push:
    branches: [risk29-poc]
    paths:
      - .github/workflows/risk29-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: risk29-poc

      - name: Apply typed Risk29 category tuple fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/provider-demo/src/mock-provider.ts")
          text = path.read_text()
          old = '      categories: [\n        "macro",\n        "credit",\n        "valuation",\n        "sentiment",\n        "qualitative",\n        "liquidity",\n        "global",\n        "technical",\n      ].map(unavailableCategory),'
          new = '      categories: (\n        [\n          "macro",\n          "credit",\n          "valuation",\n          "sentiment",\n          "qualitative",\n          "liquidity",\n          "global",\n          "technical",\n        ] as const\n      ).map(unavailableCategory),'
          if old not in text:
              raise SystemExit("Risk29 category map anchor not found")
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/provider-demo/src/mock-provider.ts
          git commit -m "fix(risk29): type demo category ids as literals"
          git push origin HEAD:risk29-poc
