name: Risk29 integration fix

on:
  push:
    branches: [risk29-poc]
    paths:
      - .github/workflows/risk29-integration-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: risk29-poc
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Risk29 first-class integration fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Promote the two proven POC capabilities into the kernel union.
          replace(
              "packages/spec/src/types.ts",
              '  | "retail-gold-price"\n  | "portfolio";',
              '  | "retail-gold-price"\n  // Private intelligence capabilities. Scores/states are calculated upstream;\n  // providers only transport the versioned Risk29 contract.\n  | "risk29-snapshot"\n  | "risk29-history"\n  | "portfolio";',
          )

          # All five Risk29 frames are now first-class metadata, not a runtime overlay.
          replace(
              "packages/frames/src/schemas.ts",
              'import { risk29ScoreMeta } from "./schemas/risk29";',
              'import {\n  risk29CategoriesMeta,\n  risk29ChangesMeta,\n  risk29HeatmapMeta,\n  risk29HistoryMeta,\n  risk29ScoreMeta,\n} from "./schemas/risk29";',
          )
          replace(
              "packages/frames/src/schemas.ts",
              '  returnDistributionMeta,\n  risk29ScoreMeta,\n  rsiMomentumMeta,',
              '  returnDistributionMeta,\n  risk29CategoriesMeta,\n  risk29ChangesMeta,\n  risk29HeatmapMeta,\n  risk29HistoryMeta,\n  risk29ScoreMeta,\n  rsiMomentumMeta,',
          )

          # Runtime must consume the shared lazy registry; eager overlays violate lazy-loading invariants.
          Path("apps/runtime/src/lazy-registry.ts").write_text('''// The lazy registry was promoted into @zframes/frames so other hosts (the\n// explorer) can share it; this module stays as the runtime's import site and\n// the home of its contract test (./lazy-registry.test.ts).\nexport {\n  createLazyRegistry,\n  prefetchFrames,\n} from "@zframes/frames/lazy-registry";\n''')

          # The plugins composition leaf is intentionally allowed to depend on every built-in plugin.
          replace(
              "tests/dep-dag.test.ts",
              '    "@zframes/provider-demo",\n    "@zframes/provider-wallet",',
              '    "@zframes/provider-demo",\n    "@zframes/provider-risk29",\n    "@zframes/provider-wallet",',
          )

          # Risk29 cards display scores, states and source-native values rather than board currency.
          replace(
              "packages/frames/src/frame-content-smoke.test.tsx",
              '  "reserve-risk": "the reserve-risk ratio",\n  "rsi-momentum": "RSI, 0–100",',
              '  "reserve-risk": "the reserve-risk ratio",\n  "risk29-categories": "engine-supplied 0–100 category risk scores and weights",\n  "risk29-changes": "engine-supplied state transitions and score deltas",\n  "risk29-heatmap": "source-native observations plus 0–100 risk scores",\n  "risk29-history": "historical 0–100 aggregate/category risk scores",\n  "risk29-score": "engine-supplied 0–100 aggregate risk score and data health",\n  "rsi-momentum": "RSI, 0–100",',
          )

          # Generic capability routing lets the real Risk29 provider win in production and
          # the synthetic demo provider satisfy hermetic frame-smoke tests.
          p = Path("packages/core/src/risk29-hooks.tsx")
          text = p.read_text()
          text = text.replace('useProviderFor("risk29-snapshot" as Capability, "risk29")', 'useProviderFor("risk29-snapshot" as Capability)')
          text = text.replace('useProviderFor("risk29-history" as Capability, "risk29")', 'useProviderFor("risk29-history" as Capability)')
          p.write_text(text)

          # Demo provider must keep its repo invariant: every capability has deterministic offline data.
          replace(
              "packages/provider-demo/src/mock-provider.ts",
              '} from "@zframes/spec";\n',
              '} from "@zframes/spec";\nimport type { Risk29History, Risk29Snapshot } from "@zframes/spec/risk29";\n',
          )
          replace(
              "packages/provider-demo/src/mock-provider.ts",
              '  "retail-gold-price",\n  "portfolio",',
              '  "retail-gold-price",\n  "risk29-snapshot",\n  "risk29-history",\n  "portfolio",',
          )
          replace(
              "packages/provider-demo/src/mock-provider.ts",
              '  // ── on-chain valuation / cycle ──────────────────────────────────────────',
              '''  getRisk29Snapshot(): Promise<Risk29Snapshot> {\n    const generatedAt = new Date(BASELINE_NOW).toISOString();\n    const unavailableCategory = (id: Risk29Snapshot["categories"][number]["id"]): Risk29Snapshot["categories"][number] => ({\n      id,\n      label: id,\n      weight: 0,\n      score: null,\n      state: "unavailable",\n      availableSignals: 0,\n      totalSignals: 0,\n    });\n    const empty: Risk29Snapshot = {\n      schemaVersion: "1",\n      modelVersion: "demo-risk29-v1",\n      thresholdVersion: "demo-risk29-v1",\n      generatedAt,\n      score: null,\n      state: "unavailable",\n      regime: "unavailable",\n      categories: ["macro", "credit", "valuation", "sentiment", "qualitative", "liquidity", "global", "technical"].map(unavailableCategory),\n      signals: [{\n        id: "demo-vix", label: "Demo VIX", category: "sentiment", source: "demo",\n        value: null, unit: "index", riskScore: null, state: "unavailable", asOf: null,\n        fetchedAt: generatedAt, ageSeconds: null, freshness: "error",\n        reason: "synthetic demo has no current observation", thresholdVersion: "demo-risk29-v1",\n      }],\n      changes: [],\n      health: { available: 0, stale: 0, errored: 1, total: 1 },\n    };\n    return this.gate<Risk29Snapshot>(empty, () => ({\n      ...empty,\n      score: 48,\n      state: "watch",\n      regime: "neutral",\n      categories: empty.categories.map((category) =>\n        category.id === "sentiment"\n          ? { ...category, weight: 16, score: 48, state: "watch", availableSignals: 1, totalSignals: 1 }\n          : category,\n      ),\n      signals: [{\n        id: "demo-vix", label: "Demo VIX", category: "sentiment", source: "demo",\n        value: 19.8, unit: "index", riskScore: 48, state: "watch", direction: "flat",\n        change: 0, changeWindow: "1d", asOf: generatedAt.slice(0, 10),\n        fetchedAt: generatedAt, ageSeconds: 0, freshness: "fresh", thresholdVersion: "demo-risk29-v1",\n      }],\n      health: { available: 1, stale: 0, errored: 0, total: 1 },\n    }));\n  }\n\n  getRisk29History(): Promise<Risk29History> {\n    const generatedAt = new Date(BASELINE_NOW).toISOString();\n    return this.gate<Risk29History>(\n      { schemaVersion: "1", generatedAt, points: [] },\n      () => ({\n        schemaVersion: "1", generatedAt,\n        points: [\n          { time: BASELINE_NOW - DAY, score: 46, state: "watch", categoryScores: { sentiment: 46 } },\n          { time: BASELINE_NOW, score: 48, state: "watch", categoryScores: { sentiment: 48 } },\n        ],\n      }),\n    );\n  }\n\n  // ── on-chain valuation / cycle ──────────────────────────────────────────''',
          )

          # Capability coverage must mirror the actual dev mount: public keyless + private Risk29 + keyed account providers.
          p = Path("tests/capability-coverage.test.ts")
          text = p.read_text()
          text = text.replace(
              'let binance: MarketDataProvider | undefined;\nlet wallet: MarketDataProvider | undefined;',
              'let risk29: MarketDataProvider | undefined;\nlet binance: MarketDataProvider | undefined;\nlet wallet: MarketDataProvider | undefined;',
          )
          text = text.replace(
              'const [keylessMod, binanceMod, walletMod] = await Promise.all([\n      import("../packages/providers-keyless/src/index"),\n      import("../packages/provider-binance/src/index"),\n      import("../packages/provider-wallet/src/index"),\n    ]);',
              'const [keylessMod, risk29Mod, binanceMod, walletMod] = await Promise.all([\n      import("../packages/providers-keyless/src/index"),\n      import("../packages/provider-risk29/src/index"),\n      import("../packages/provider-binance/src/index"),\n      import("../packages/provider-wallet/src/index"),\n    ]);',
          )
          text = text.replace(
              'keyless = keylessMod.createKeylessProviders();\n    binance = new binanceMod.BinanceProvider();\n    wallet = new walletMod.WalletProvider();',
              'keyless = keylessMod.createKeylessProviders();\n    risk29 = new risk29Mod.Risk29Provider("https://risk29.example");\n    binance = new binanceMod.BinanceProvider();\n    wallet = new walletMod.WalletProvider();',
          )
          text = text.replace(
              'fleet = [...keyless, binance, wallet];',
              'fleet = [...keyless, risk29, binance, wallet];',
          )
          text = text.replace(
              'it("mounts one instance per keyless provider package, plus the keyed pair", () => {',
              'it("mounts keyless providers, Risk29, and the keyed account pair", () => {',
          )
          text = text.replace('expect(fleet).toHaveLength(declared.length + 2);', 'expect(fleet).toHaveLength(declared.length + 3);')
          text = text.replace(
              'it("the keyless set alone serves every frame need except portfolio", () => {',
              'it("the keyless set alone leaves only private Risk29 and portfolio needs", () => {',
          )
          old = '''    expect(unservedNeeds(allFrameMetas, keylessAdvertised)).toEqual(\n      accountFrames.map((m) => `${m.name} → portfolio`),\n    );'''
          new = '''    const privateRisk29Needs = allFrameMetas.flatMap((m) =>\n      m.capabilities\n        .filter((capability) =>\n          capability === "risk29-snapshot" || capability === "risk29-history",\n        )\n        .map((capability) => `${m.name} → ${capability}`),\n    );\n    expect(unservedNeeds(allFrameMetas, keylessAdvertised)).toEqual([\n      ...privateRisk29Needs,\n      ...accountFrames.map((m) => `${m.name} → portfolio`),\n    ]);'''
          if old not in text:
              raise SystemExit("keyless expectation anchor not found")
          text = text.replace(old, new, 1)
          old = '''    const keyedOnly = [...advertised].filter(\n      (capability) => !keylessAdvertised.has(capability),\n    );\n    expect(keyedOnly).toEqual(["portfolio"]);'''
          new = '''    expect(risk29?.capabilities).toEqual([\n      "risk29-snapshot",\n      "risk29-history",\n    ]);\n    const keyedOnly = new Set([\n      ...(binance?.capabilities ?? []),\n      ...(wallet?.capabilities ?? []),\n    ]);\n    expect([...keyedOnly]).toEqual(["portfolio"]);'''
          if old not in text:
              raise SystemExit("keyedOnly anchor not found")
          text = text.replace(old, new, 1)
          p.write_text(text)

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          packages/spec/src/types.ts
          packages/frames/src/schemas.ts
          apps/runtime/src/lazy-registry.ts
          tests/dep-dag.test.ts
          packages/frames/src/frame-content-smoke.test.tsx
          packages/core/src/risk29-hooks.tsx
          packages/provider-demo/src/mock-provider.ts
          tests/capability-coverage.test.ts
      - name: Commit integration fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/spec/src/types.ts packages/frames/src/schemas.ts apps/runtime/src/lazy-registry.ts tests/dep-dag.test.ts packages/frames/src/frame-content-smoke.test.tsx packages/core/src/risk29-hooks.tsx packages/provider-demo/src/mock-provider.ts tests/capability-coverage.test.ts
          git commit -m "fix(risk29): satisfy repository integration invariants"
          git push origin HEAD:risk29-poc
